name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      FASTMCP_CHECK_FOR_UPDATES: "off"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install uv
        run: python -m pip install uv==0.13.9
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Check generated pip exports
        if: matrix.python == '3.12'
        run: |
          git ls-files --error-unmatch requirements.txt requirements-dev.txt > /dev/null
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file requirements.txt > /dev/null
          uv export --locked --no-emit-project --no-hashes --output-file requirements-dev.txt > /dev/null
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Lint
        if: matrix.python == '3.12'
        run: uv run --locked python -m ruff check .
      - name: Check formatting
        if: matrix.python == '3.12'
        run: uv run --locked python -m ruff format --check --diff .
      - name: Check production types
        if: matrix.python == '3.12'
        run: uv run --locked ty check --error-on-warning
      - name: Run offline unit and MCP tests
        run: uv run --locked --python ${{ matrix.python }} python -m pytest -q
