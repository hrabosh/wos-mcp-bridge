name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install uv
        run: python -m pip install uv==0.13.9
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Check generated pip exports
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file requirements.txt > /dev/null
          uv export --locked --no-emit-project --no-hashes --output-file requirements-dev.txt > /dev/null
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Lint
        run: uv run --locked python -m ruff check .
      - name: Check formatting
        run: uv run --locked python -m ruff format --check --diff .
      - name: Run offline unit and MCP tests
        run: uv run --locked python -m pytest -q
