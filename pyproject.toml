[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wos-mcp-bridge"
version = "0.1.0"
description = "Read-only MCP tools for Web of Science and open-access scientific literature"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "web-of-science", "scientific-literature", "open-access"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastmcp>=4.1.7,<5",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13.4,<3",
    "defusedxml>=0.7.1,<0.8",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
]

[project.urls]
Homepage = "https://github.com/hrabosh/wos-mcp-bridge"
Repository = "https://github.com/hrabosh/wos-mcp-bridge"
Issues = "https://github.com/hrabosh/wos-mcp-bridge/issues"
Documentation = "https://github.com/hrabosh/wos-mcp-bridge#readme"

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.0",
    "ty==0.0.106",
    "jsonschema[format-nongpl]==4.26.0",
    "twine==7.0.0",
    "packaging>=25,<27",
]

[tool.uv]
required-version = "==0.13.9"

[project.scripts]
wos-mcp-bridge = "wos_mcp_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: opt-in live literature API requests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "server.py"]
